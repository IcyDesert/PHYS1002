name: Call Worktree Update

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # 为避免大量发包触发 API 上限，使用略微随机一些的方法
    - cron: ${{ format('{0} * * * *', github.run_id % 60) }}

jobs:
  call_reusable_workflow:
    # 测试阶段使用测试分支
    uses: HITSZ-OpenAuto/repos-management/.github/workflows/reusable_trigger_workflow.yml@feat/unified-trigger
    permissions:
      contents: write
      pull-requests: write

    with:
      # 仅当事件是 push 到 main 分支时，才将 trigger_downstream 设置为 true
      trigger_page_buildtrigger_downstream: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    # 2. 传递 PAT secret
    secrets:
      PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
