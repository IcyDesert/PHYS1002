name: Call Worktree Update

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  call_reusable_workflow:
    # 测试阶段使用测试分支
    uses: HITSZ-OpenAuto/repos-management/.github/workflows/reusable_worktree_generate.yml@feat/unified-trigger
    permissions:
      contents: write
      pull-requests: write

    with:
      # 仅当事件是 push 到 main 分支时，才将 trigger_downstream 设置为 true
      trigger_page_build: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    # 2. 传递 PAT secret
    secrets:
      PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
